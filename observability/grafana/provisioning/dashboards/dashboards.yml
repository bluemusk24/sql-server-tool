# File provider for the pre-built dashboards (#47): Grafana watches this
# directory and imports/refreshes the JSON dashboards inside it.
apiVersion: 1

providers:
  - name: sdip
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
