# Provisioned datasources (#45) — the stack comes up fully wired, no
# clicking and no secrets. Fixed UIDs keep the cross-links stable.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # From a trace, jump to the logs of the same request window.
      # (Full trace↔log correlation needs trace ids in the log lines —
      # a natural follow-up once request logging lands.)
      tracesToLogs:
        datasourceUid: loki
        spanStartTimeShift: -1h
        spanEndTimeShift: 1h
