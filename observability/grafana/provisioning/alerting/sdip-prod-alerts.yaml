# Prod-scoped alerting for the deployed observability backend. Two
# Grafana-managed rules, provisioned like the dashboard so they survive
# free-tier data resets (UI-created rules would not).
#
# Both are filtered to deployment_environment="prod" — they watch the
# sql-server-prod service's telemetry only; dev activity never fires
# them.
#
# Rule 1 — "Prod: repeated creation failures" (sdip-prod-creation-failures)
#   sdip_creations_failed_total is the counter behind the dashboard's
#   Creation failures panel (object_type = investigation | report).
#   Threshold rationale: creations are human-paced and normally never
#   fail, so > 3 failures in 15 minutes means someone on prod is stuck;
#   for: 5m keeps one-off blips from paging; noDataState OK (quiet
#   periods must not alert).
#
# Rule 2 — "Prod: investigation started" (sdip-prod-investigation-started)
#   sdip_investigations_created_total, one increment per investigation
#   a DBA creates on prod (whole instance or database scope — the
#   environment label comes from the prod service, not the target).
#   Fires so the team always knows when prod is being investigated.
#
# Every firing alert carries deployment_environment, service_name and
# service_version (labels promoted from the OTLP resource attributes by
# the collector) plus owner: dba-team. Change `owner` here if the
# on-call DBA changes — it is a label AND an annotation.
#
# Notifications: alerts always appear in Grafana's Alerting UI and on
# the dashboard's "Active alerts" panel. To also receive them by email/
# Slack/webhook, add a contact point in Grafana (Alerting → Contact
# points) — see observability/README.md.
apiVersion: 1

groups:
  - orgId: 1
    name: sdip-prod
    folder: SDIP
    interval: 1m
    rules:
      - uid: sdip-prod-creation-failures
        title: "Prod: repeated creation failures"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              expr: >-
                sum by (deployment_environment, service_name,
                service_version, object_type)
                (increase(sdip_creations_failed_total{deployment_environment="prod"}[15m]))
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - operator:
                    type: and
                  query:
                    refId: B
                  reducer:
                    type: last
                  evaluator:
                    type: gt
                    params: [3]
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 5m
        isPaused: false
        labels:
          owner: dba-team
          severity: warning
        annotations:
          summary: >-
            Repeated {{ $labels.object_type }} creation failures on
            production ({{ $labels.service_name }}, version
            {{ $labels.service_version }}): {{ $value }} failures within
            15 minutes, sustained for 5 minutes.
          description: >-
            Creation requests are failing repeatedly on PROD — users
            there cannot create {{ $labels.object_type }}s. Check the
            app logs for the prod environment and deployed version, then
            roll back or hotfix. Owner: dba-team.
          owner: dba-team
          dashboard_url: https://sdip-observability.onrender.com/d/sdip-app-metrics

      - uid: sdip-prod-investigation-started
        title: "Prod: investigation started"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              expr: >-
                sum by (deployment_environment, service_name,
                service_version)
                (increase(sdip_investigations_created_total{deployment_environment="prod"}[15m]))
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - operator:
                    type: and
                  query:
                    refId: B
                  reducer:
                    type: last
                  evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 1m
        isPaused: false
        labels:
          owner: dba-team
          severity: info
        annotations:
          summary: >-
            A diagnostic investigation was started on production
            ({{ $labels.service_name }}, version
            {{ $labels.service_version }}).
          description: >-
            A DBA started an SDIP investigation against PROD (any scope —
            whole instance or named databases). This is an activity
            signal: open the prod app's investigation queue for details.
            Owner: dba-team.
          owner: dba-team
          dashboard_url: https://sdip-observability.onrender.com/d/sdip-app-metrics
