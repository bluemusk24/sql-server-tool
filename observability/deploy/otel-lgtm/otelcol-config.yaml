# Collector config for the deployed observability backend (#48),
# slimmed for Render free tier's 512 MB:
#   - logs + profiles pipelines dropped (Loki/Pyroscope not in image)
#   - debug exporters dropped
#   - traces accepted but DISCARDED (file exporter -> /dev/null):
#     Tempo was removed from the image — its WAL grew under the apps'
#     constant health-check trace stream and OOM-cycled the instance
#     every ~6-9 minutes. Metrics + alerting are unaffected.
#   - memory_limiter guards the collector against being the OOM cause
#   - self-scrape relaxed from 1s to 15s
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 15s
          static_configs:
            - targets: ["127.0.0.1:8888"]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 300
  batch:

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  # Blackhole: keeps apps' OTLP /v1/traces POSTs succeeding (no client
  # retry churn) while dropping every span at negligible cost.
  file/blackhole:
    path: /dev/null

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/blackhole]
    metrics:
      receivers: [otlp, prometheus/collector]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/metrics]
