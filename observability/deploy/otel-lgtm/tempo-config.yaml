# Tempo config for the deployed observability backend (#48), slimmed
# for Render free tier's 512 MB: the metrics_generator (span-metrics +
# service-graphs) is dropped — no panel uses it, and it runs a second
# WAL plus a remote-write loop for every span.
server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "127.0.0.1:4417"
        http:
          endpoint: "127.0.0.1:4418"

memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 7947

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9096

storage:
  trace:
    backend: local
    wal:
      path: /data/tempo/wal
    local:
      path: /data/tempo/blocks
