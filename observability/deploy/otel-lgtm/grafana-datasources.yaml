# Datasources for the deployed observability backend (#48): upstream
# grafana/otel-lgtm v0.36.0 minus Pyroscope, Loki and Tempo (the
# deployed instance is metrics + alerting only — 512 MB budget; Loki
# and Tempo remain in the local compose stack). The Prometheus uid
# stays `prometheus` so the provisioned SDIP dashboard resolves
# unchanged.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://127.0.0.1:9090
    editable: true
    jsonData:
      timeInterval: 15s
