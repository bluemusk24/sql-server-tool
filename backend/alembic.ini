# Alembic configuration for the SQL Server Diagnostic Assistant backend.
#
# The database URL is injected at runtime (see alembic/env.py), which reads
# $DATABASE_URL — the same variable the app itself uses. You can override it
# here for manual runs, but keeping it in the environment avoids duplicating
# credentials across files.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# template used to name new revision files
file_template = %%(rev)s_%%(slug)s

# SQLAlchemy connection URL; env.py overrides this from $DATABASE_URL.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
