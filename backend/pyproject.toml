[project]
name = "sql-server-tool"
version = "0.1.0"
description = "SQL Server Diagnostic Assistant"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pypdf>=6.20.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# B008 (function call in argument defaults) is the idiomatic FastAPI
# `Depends(...)` pattern, so it is excluded for this project.
ignore = ["B008"]
