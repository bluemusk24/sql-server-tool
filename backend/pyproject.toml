[project]
name = "sql-server-tool"
version = "0.1.0"
description = "SQL Server Diagnostic Assistant"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pyodbc>=5.3.0",
    "sqlalchemy>=2.1.4",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "pypdf>=6.20.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
