<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 880" width="1160" height="880" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>SDIP — SQL Server Diagnostic Assistant: production architecture</title>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .h1 { font-weight: 700; font-size: 18px; fill: #0f172a; }
    .h2 { font-size: 10px; fill: #64748b; }
    .ln { font-weight: 700; font-size: 11px; fill: #475569; letter-spacing: 0.6px; }
    .tt { font-weight: 700; font-size: 12.5px; fill: #0f172a; }
    .bb { font-size: 10.5px; fill: #334155; }
    .mm { font-size: 9.5px; fill: #475569; }
    .mi { font-size: 9px; fill: #64748b; }
    .ft { font-size: 10px; fill: #64748b; }
    .bx { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.1; rx: 7; }
    .ld { stroke: #cbd5e1; stroke-width: 1; rx: 10; }
    .ar { stroke: #64748b; stroke-width: 1.3; fill: none; }
    .dr { stroke: #64748b; stroke-width: 1.3; fill: none; stroke-dasharray: 4 3; }
  </style>

  <rect x="0" y="0" width="1160" height="880" fill="#f8fafc"/>

  <!-- Title -->
  <text class="h1" x="30" y="30">SDIP — SQL Server Diagnostic Assistant: production architecture</text>
  <text class="h2" x="1130" y="30" text-anchor="end">2026-10-21 · commits ≥ a811320 · 169 tests · $0 stack</text>

  <!-- ═══ LANE 1 · CLIENTS ═══ -->
  <rect class="ld" x="30" y="56" width="1100" height="104" fill="#eef2ff"/>
  <text class="ln" x="42" y="72">CLIENTS — one origin, same bearer tokens</text>

  <rect class="bx" x="50" y="82" width="300" height="64"/>
  <text class="tt" x="64" y="102">DBA web console — React SPA</text>
  <text class="mm" x="64" y="120">browser · Vite dev server locally,</text>
  <text class="mm" x="64" y="134">static bundle served by FastAPI in prod</text>

  <rect class="bx" x="390" y="82" width="330" height="64" stroke="#4f46e5" stroke-width="1.4"/>
  <text class="tt" x="404" y="102">AI assistants — MCP clients</text>
  <text class="mm" x="404" y="120">Claude Code · Cursor · any client</text>
  <text class="mm" x="404" y="134">speaking streamable HTTP</text>

  <rect class="bx" x="760" y="82" width="250" height="64"/>
  <text class="tt" x="774" y="102">Scripts &amp; API clients</text>
  <text class="mm" x="774" y="120">curl · CI · other services</text>
  <text class="mm" x="774" y="134">with a login-obtained token</text>

  <!-- clients → app arrows -->
  <line class="ar" x1="200" y1="146" x2="200" y2="192" marker-end="url(#ar)"/>
  <text class="mi" x="208" y="164">REST + static SPA</text>
  <line class="ar" x1="555" y1="146" x2="555" y2="192" marker-end="url(#ar)"/>
  <text class="mi" x="563" y="162">POST /mcp — streamable HTTP,</text>
  <text class="mi" x="563" y="176">stateless JSON · Bearer or 401</text>
  <line class="ar" x1="885" y1="146" x2="885" y2="192" marker-end="url(#ar)"/>
  <text class="mi" x="893" y="164">REST · Bearer token</text>

  <!-- ═══ LANE 2 · APPLICATION SERVICE ═══ -->
  <rect class="ld" x="30" y="196" width="890" height="280" fill="#ecfeff"/>
  <text class="ln" x="42" y="214">APPLICATION SERVICE — RENDER (ONE CONTAINER) · prod sql-server-prod (manually promoted) · dev sql-server-n68y</text>

  <rect class="bx" x="50" y="236" width="370" height="104"/>
  <text class="tt" x="64" y="256">FastAPI app — REST + session</text>
  <text class="bb" x="64" y="274">· REST routers: auth · investigations</text>
  <text class="bb" x="64" y="288">  approvals · jobs · reports · fleet</text>
  <text class="bb" x="64" y="306">· opaque bearer tokens (DB-stored),</text>
  <text class="bb" x="64" y="320">  shared with MCP · serves SPA (API → /mcp → SPA)</text>

  <rect class="bx" x="440" y="236" width="460" height="104" stroke="#4f46e5" stroke-width="1.4"/>
  <text class="tt" x="454" y="256">MCP server — /mcp (official mcp SDK 2.x)</text>
  <text class="bb" x="454" y="274">· stateless JSON per POST · wrapper binds store + user</text>
  <text class="bb" x="454" y="288">· 7 tools: catalog · investigations · report · fleet</text>
  <text class="bb" x="454" y="302">  · create_investigation · start_investigation_run</text>
  <text class="bb" x="454" y="320"><tspan fill="#dc2626" font-weight="700">✗ NO approval tool</tspan> — SQL review stays human-only</text>

  <rect class="bx" x="50" y="356" width="370" height="104"/>
  <text class="tt" x="64" y="376">Human approval gate</text>
  <text class="bb" x="64" y="394">· DBA reviews each query's sql_text in the UI</text>
  <text class="bb" x="64" y="408">· approve / reject per catalog entry</text>
  <text class="bb" x="64" y="426">· runs refuse until everything is approved</text>
  <text class="bb" x="64" y="440">  (REST and MCP alike — no bypass)</text>

  <rect class="bx" x="440" y="356" width="460" height="104"/>
  <text class="tt" x="454" y="376">Diagnostics pipeline — read-only</text>
  <text class="bb" x="454" y="394">· live collection: ODBC Driver 18 · ApplicationIntent=ReadOnly</text>
  <text class="bb" x="454" y="408">· statement text truncated at the collection boundary (#52)</text>
  <text class="bb" x="454" y="426">· analysis: findings → primary cause → confidence → guidance</text>
  <text class="bb" x="454" y="440">· reports rendered as JSON + PDF from one payload</text>

  <!-- internal arrows -->
  <line class="ar" x1="420" y1="288" x2="440" y2="288" marker-end="url(#ar)"/>
  <line class="dr" x1="160" y1="356" x2="160" y2="342" marker-end="url(#ar)"/>
  <text class="mi" x="168" y="353">blocks run until approved</text>
  <line class="ar" x1="600" y1="342" x2="600" y2="354" marker-end="url(#ar)"/>
  <text class="mi" x="608" y="353">start_run (credentials enter here)</text>

  <!-- customer SQL Server (external) -->
  <text class="mi" x="950" y="350">EXTERNAL — PER LIVE RUN</text>
  <rect x="950" y="356" width="180" height="104" fill="#ffffff" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 3" rx="7"/>
  <text class="tt" x="963" y="378" font-size="11.5">Customer SQL Server</text>
  <text class="mm" x="963" y="396">· target of live runs</text>
  <text class="mm" x="963" y="412">· catalog SQL only,</text>
  <text class="mm" x="963" y="426">  always read-only</text>
  <text class="mm" x="963" y="442">· credentials: connect</text>
  <text class="mm" x="963" y="454">  only, never stored</text>
  <line class="ar" x1="900" y1="408" x2="946" y2="408" marker-end="url(#ar)"/>
  <text class="mi" x="923" y="400" text-anchor="middle">SQL</text>

  <!-- app → data arrows -->
  <line class="ar" x1="200" y1="476" x2="200" y2="530" marker-end="url(#ar)"/>
  <text class="mi" x="208" y="506">SQLAlchemy</text>
  <line class="ar" x1="985" y1="476" x2="985" y2="530" marker-end="url(#ar)"/>
  <text class="mi" x="993" y="506">dev &amp; local</text>

  <!-- ═══ LANE 3 · DATA ═══ -->
  <rect class="ld" x="30" y="500" width="1100" height="110" fill="#f0fdf4"/>
  <text class="ln" x="42" y="518">DATA &amp; DURABILITY</text>

  <rect class="bx" x="50" y="534" width="300" height="64"/>
  <text class="tt" x="64" y="554">Render Postgres — prod</text>
  <text class="mm" x="64" y="572">sdip_j8za · alembic v1 (no destructive</text>
  <text class="mm" x="64" y="586">migrations) · one session per request</text>

  <rect class="bx" x="380" y="534" width="450" height="64" stroke="#059669" stroke-width="1.3"/>
  <text class="tt" x="394" y="554">Backups — GitHub Actions (backup-db.yml)</text>
  <text class="mm" x="394" y="572">daily 04:17 UTC + manual dispatch · artifact</text>
  <text class="mm" x="394" y="586">restore path verified: "restore verified ✓" gate</text>

  <rect class="bx" x="860" y="534" width="250" height="64"/>
  <text class="tt" x="874" y="554">SQLite — dev &amp; local</text>
  <text class="mm" x="874" y="572">auto-reseeded demo data</text>
  <text class="mm" x="874" y="586">(ephemeral by design)</text>

  <line class="ar" x1="350" y1="566" x2="380" y2="566" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text class="mi" x="365" y="528" text-anchor="middle">pg_dump / restore</text>

  <!-- ═══ LANE 4 · CI/CD ═══ -->
  <rect class="ld" x="30" y="622" width="1100" height="110" fill="#fff7ed"/>
  <text class="ln" x="42" y="640">CI / CD — GITHUB ACTIONS · production never deploys on push</text>

  <rect class="bx" x="50" y="656" width="250" height="64"/>
  <text class="tt" x="64" y="676" font-size="12">CI on every push</text>
  <text class="mm" x="64" y="694">ruff · 169 pytest · vitest · Playwright</text>
  <text class="mm" x="64" y="708">→ image pushed to GHCR</text>

  <rect class="bx" x="330" y="656" width="250" height="64"/>
  <text class="tt" x="344" y="676" font-size="12">Auto-deploy → dev</text>
  <text class="mm" x="344" y="694">health gate: dev /health must</text>
  <text class="mm" x="344" y="708">echo the built commit + image</text>

  <rect class="bx" x="610" y="656" width="250" height="64" stroke="#d97706" stroke-width="1.7"/>
  <text class="tt" x="624" y="676" font-size="12" fill="#b45309">MANUAL promote gate</text>
  <text class="mm" x="624" y="694">promote-to-prod.yml (dispatch):</text>
  <text class="mm" x="624" y="706">GHCR ref exists + prod /health</text>
  <text class="mi" x="624" y="717" font-size="8.5">deploys the application service above</text>

  <rect class="bx" x="890" y="656" width="220" height="64"/>
  <text class="tt" x="904" y="676" font-size="12">Rollback = old image tag</text>
  <text class="mm" x="904" y="694">drilled 2026-10-21 — ~2 min</text>
  <text class="mm" x="904" y="708">same workflow, older ref</text>

  <line class="ar" x1="300" y1="688" x2="330" y2="688" marker-end="url(#ar)"/>
  <line class="ar" x1="580" y1="688" x2="610" y2="688" marker-end="url(#ar)"/>
  <line class="dr" x1="860" y1="688" x2="890" y2="688" marker-end="url(#ar)"/>
  <text class="mi" x="875" y="681" text-anchor="middle" font-size="8.5">or rollback</text>

  <!-- ═══ LANE 5 · OBSERVABILITY ═══ -->
  <rect class="ld" x="30" y="744" width="1100" height="100" fill="#faf5ff"/>
  <text class="ln" x="42" y="762">OBSERVABILITY — SEPARATE RENDER FREE SERVICE (sdip-observability) · APP → OTLP → HERE</text>

  <rect class="bx" x="50" y="778" width="270" height="54"/>
  <text class="tt" x="64" y="798" font-size="12">OTLP export</text>
  <text class="mm" x="64" y="816">traces + metrics · token header</text>

  <rect class="bx" x="350" y="778" width="330" height="54"/>
  <text class="tt" x="364" y="798" font-size="12">otel-lgtm + Caddy (one public port)</text>
  <text class="mm" x="364" y="816">collector → Prometheus · Grafana (traces dropped)</text>

  <rect class="bx" x="710" y="778" width="400" height="54"/>
  <text class="tt" x="724" y="798" font-size="12">Dashboards + alerting</text>
  <text class="mm" x="724" y="816">zero-baseline counters (#50) · provisioned rules sdip-prod-alerts.yaml</text>

  <line class="ar" x1="320" y1="805" x2="350" y2="805" marker-end="url(#ar)"/>
  <line class="ar" x1="680" y1="805" x2="710" y2="805" marker-end="url(#ar)"/>

  <!-- Footer -->
  <text class="ft" x="30" y="866">Read-only diagnostics · credentials session-only (never stored, logged, or committed) · human approval before every run · no MCP tool ever contacts a SQL Server directly</text>
</svg>
