# Render blueprint — two independent environments, both on the $0
# free tier (#41), serving pre-built registry images (#42):
#
#   dev          sql-server      → ghcr.io/.../sql-server-tool:dev
#   production   sql-server-prod → ghcr.io/.../sql-server-tool:prod
#   database     sdip-db (the workspace's ONE free Postgres) → production
#
# CI builds the image once per push to main and publishes an immutable
# YYYYMMDD-HHMMSS-shortsha tag to GHCR (the repo is public, so the
# package is free and Render pulls it with no credentials):
#   - the deploy job moves :dev  to the tested tag, then fires the hook
#   - the promote workflow moves :prod to what dev currently serves
# Render pulls the channel tag on every deploy and restart, so each
# channel must always equal what that environment should serve.
# Deploy: GitHub → Actions → "Promote dev to production" (manual) for
# production; dev deploys on every green push to main (CI).
#
# Production hardening: set SEED_DBA_PASSWORD / SEED_ADMIN_PASSWORD on
# sql-server-prod so the shared URL never uses the published demo
# logins; the app rotates any login still on its demo password to the
# override on the next boot (#41).
#
# The service name decides the public URL: https://<name>.onrender.com.
# The dev name must stay `sql-server` — renaming it changes the shared
# URL and breaks the CI deploy gate (RENDER_APP_URL).
#
# One-time migration note: switching an existing service from
# `runtime: docker` (source build) to `runtime: image` applies in place
# under the same name — the URL does not change.
#
# Free-plan notes:
#   - both services sleep after inactivity; the first visit after an
#     idle period waits ~30-60s while they wake
#   - free Postgres instances are recycled periodically (Render
#     currently: ~30 days); the app reseeds demo data whenever the
#     database is empty — export reports as PDFs to keep records
#   - the dev SQLite file lives on the container's ephemeral disk
#     (/data) and resets on every deploy — intended for a dev box

services:
  # ── dev ────────────────────────────────────────────────────────────
  # The :dev channel tag is moved only by ci.yaml's gated deploy job,
  # so a restart can never pick up an untested build.
  - type: web
    name: sql-server
    runtime: image
    plan: free
    healthCheckPath: /health
    image:
      url: ghcr.io/bluemusk24/sql-server-tool:dev
    envVars:
      # SQLite in the container's writable, ephemeral /data directory.
      - key: SDIP_DATABASE_URL
        value: sqlite:////data/sdip.db

  # ── production ─────────────────────────────────────────────────────
  # The :prod channel tag is moved only by the promote workflow.
  - type: web
    name: sql-server-prod
    runtime: image
    plan: free
    healthCheckPath: /health
    image:
      url: ghcr.io/bluemusk24/sql-server-tool:prod
    envVars:
      - key: SDIP_DATABASE_URL
        fromDatabase:
          name: sdip-db
          property: connectionString
      # Production must not use the published demo logins (#41): set
      # both in the dashboard (Environment tab). They are marked
      # sync:false so the values live only in the dashboard, never in
      # this repository.
      - key: SEED_DBA_PASSWORD
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  # The workspace's single free Postgres belongs to production (#41).
  - name: sdip-db
    plan: free
    databaseName: sdip
    user: sdip
