# Render blueprint — two independent environments from one repository
# (#41):
#
#   dev          sql-server      + sdip-db        auto-deploys from main
#   production   sql-server-prod + sdip-db-prod   manual deploys only
#
# Each environment is a separate web service with its own managed
# Postgres and its own URL; nothing is shared. Deploy: Render Dashboard
# → New → Blueprint → this repository. Render reads this file, builds
# the root Dockerfile (single image: API serves the SPA), provisions the
# databases, and wires each service to its own connection string.
#
# Promoting dev → production: once a deploy of `main` is verified on
# dev, Dashboard → sql-server-prod → Manual Deploy → Deploy latest
# commit. Production never advances on push.
#
# The service name decides the public URL: https://<name>.onrender.com.
# The dev name must stay `sql-server` — renaming it changes the shared
# URL and breaks the CI deploy gate (RENDER_APP_URL).
#
# Cost notes:
#   - both web services are free (they sleep after inactivity; the first
#     visit after an idle period waits ~30-60s while they wake)
#   - Render allows only ONE free Postgres per workspace, so the
#     production database uses the paid Starter plan (~$7/month, card on
#     file required); dev keeps the free database
#   - free Postgres instances expire periodically (Render currently: 30
#     days); the app reseeds demo data whenever its database is empty

services:
  # ── dev ────────────────────────────────────────────────────────────
  - type: web
    name: sql-server
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # Render's Postgres connection string (a bare postgres:// URL) is
      # pinned to the installed psycopg driver by the backend.
      - key: SDIP_DATABASE_URL
        fromDatabase:
          name: sdip-db
          property: connectionString

  # ── production ─────────────────────────────────────────────────────
  # Same image, independent database, no auto-deploy: promotion is a
  # deliberate click (Manual Deploy in the dashboard).
  - type: web
    name: sql-server-prod
    runtime: docker
    plan: free
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: SDIP_DATABASE_URL
        fromDatabase:
          name: sdip-db-prod
          property: connectionString
      # Production must not use the published demo logins (#41): set
      # both in the dashboard (Environment tab → External Secrets or
      # plain entry). They are marked sync:false so the values live
      # only in the dashboard, never in this repository.
      - key: SEED_DBA_PASSWORD
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  # ── dev ────────────────────────────────────────────────────────────
  - name: sdip-db
    plan: free
    databaseName: sdip
    user: sdip

  # ── production ─────────────────────────────────────────────────────
  - name: sdip-db-prod
    plan: starter
    databaseName: sdip
    user: sdip
