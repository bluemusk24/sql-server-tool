# Render blueprint — two environments plus a separate observability
# backend, all on the $0 free tier (#41, #42, #48), serving pre-built
# registry images:
#
#   dev          sql-server          → ghcr.io/.../sql-server-tool:dev
#   production   sql-server-prod     → ghcr.io/.../sql-server-tool:prod
#   database     sdip-db (the workspace's ONE free Postgres) → production
#   observability sdip-observability → ghcr.io/.../sql-server-tool:obs
#                (collector + Prometheus + Grafana — metrics + alerting
#                only, trimmed to the free tier's 512 MB; built from
#                observability/deploy/
#
# CI builds the image once per push to main and publishes an immutable
# YYYYMMDD-HHMMSS-shortsha tag to GHCR (the repo is public, so the
# package is free and Render pulls it with no credentials):
#   - the deploy job moves :dev  to the tested tag, then fires the hook
#   - the promote workflow moves :prod to what dev currently serves
# Render pulls the channel tag on every deploy and restart, so each
# channel must always equal what that environment should serve.
# Deploy: GitHub → Actions → "Promote dev to production" (manual) for
# production; dev deploys on every green push to main (CI).
#
# Production hardening: set SEED_DBA_PASSWORD / SEED_ADMIN_PASSWORD on
# sql-server-prod so the shared URL never uses the published demo
# logins; the app rotates any login still on its demo password to the
# override on the next boot (#41).
#
# The service name decides the public URL: https://<name>.onrender.com.
# The dev name must stay `sql-server` — renaming it changes the shared
# URL and breaks the CI deploy gate (RENDER_APP_URL).
#
# One-time migration note: switching an existing service from
# `runtime: docker` (source build) to `runtime: image` applies in place
# under the same name — the URL does not change.
#
# Free-plan notes:
#   - both services sleep after inactivity; the first visit after an
#     idle period waits ~30-60s while they wake
#   - free Postgres instances are recycled periodically (Render
#     currently: ~30 days); the app reseeds demo data whenever the
#     database is empty — export reports as PDFs to keep records
#   - the dev SQLite file lives on the container's ephemeral disk
#     (/data) and resets on every deploy — intended for a dev box

services:
  # ── dev ────────────────────────────────────────────────────────────
  # The :dev channel tag is moved only by ci.yaml's gated deploy job,
  # so a restart can never pick up an untested build.
  - type: web
    name: sql-server
    runtime: image
    plan: free
    healthCheckPath: /health
    image:
      url: ghcr.io/bluemusk24/sql-server-tool:dev
    envVars:
      # SQLite in the container's writable, ephemeral /data directory.
      - key: SDIP_DATABASE_URL
        value: sqlite:////data/sdip.db
      # OpenTelemetry (#44): SDIP_ENVIRONMENT labels every span
      # (dev / prod / local). Both OTLP values are dashboard-only
      # (sync: false): point them at the observability backend (#48),
      #   OTEL_EXPORTER_OTLP_ENDPOINT=https://sdip-observability.onrender.com
      #   OTEL_EXPORTER_OTLP_HEADERS=X-Sdip-Otlp-Token=<token>
      # with the token that is also set on sdip-observability.
      # Left unset, telemetry stays dormant.
      - key: SDIP_ENVIRONMENT
        value: dev
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false

  # ── production ─────────────────────────────────────────────────────
  # The :prod channel tag is moved only by the promote workflow.
  - type: web
    name: sql-server-prod
    runtime: image
    plan: free
    healthCheckPath: /health
    image:
      url: ghcr.io/bluemusk24/sql-server-tool:prod
    envVars:
      - key: SDIP_DATABASE_URL
        fromDatabase:
          name: sdip-db
          property: connectionString
      # Production must not use the published demo logins (#41): set
      # both in the dashboard (Environment tab). They are marked
      # sync:false so the values live only in the dashboard, never in
      # this repository.
      - key: SEED_DBA_PASSWORD
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # OpenTelemetry (#44): same model as dev — environment label in
      # the blueprint, OTLP destination dashboard-only (see the dev
      # block for the values; they must point at the SAME backend so
      # one Grafana shows both environments side by side).
      - key: SDIP_ENVIRONMENT
        value: prod
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false

  # ── observability (#48) ─────────────────────────────────────────────
  # Separate from the application stack: Grafana's all-in-one LGTM
  # backend (collector + Prometheus + Grafana — metrics + alerting
  # only; Tempo/Loki/Pyroscope dropped, traces are accepted by the
  # collector and discarded) behind a Caddy front door on the single
  # exposed port:
  #   /v1/*  → OTLP ingest, gated by OTLP_INGEST_TOKEN (dev and prod
  #            send it in OTEL_EXPORTER_OTLP_HEADERS)
  #   else   → Grafana, login required (no anonymous access — the
  #            upstream image defaults to anonymous Admin, overridden
  #            here; credentials are dashboard-only secrets)
  # Prometheus is never exposed publicly.
  # Free-tier notes: no persistent disk — metrics and alert history
  # live on the ephemeral filesystem and reset whenever the service
  # redeploys, restarts, or spins down (dashboards, datasources and
  # baked into the image and survive). The stack sleeps ~15 min after
  # the last request, including the OTLP exports that keep it awake
  # while dev/prod run. It shares the workspace's 750 free instance
  # hours with the two app services.
  - type: web
    name: sdip-observability
    runtime: image
    plan: free
    healthCheckPath: /api/health
    image:
      url: ghcr.io/bluemusk24/sql-server-tool:obs
    envVars:
      # Grafana security: never ship the upstream demo default
      # (anonymous admin). Admin password is dashboard-only.
      - key: GF_AUTH_ANONYMOUS_ENABLED
        value: "false"
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"
      - key: GF_SECURITY_ADMIN_USER
        value: admin
      - key: GF_SECURITY_ADMIN_PASSWORD
        sync: false
      - key: GF_SERVER_ROOT_URL
        value: https://sdip-observability.onrender.com
      # Gate on /v1/* — same token as on dev/prod's
      # OTEL_EXPORTER_OTLP_HEADERS. Dashboard-only.
      - key: OTLP_INGEST_TOKEN
        sync: false
      # Bounded local TSDB (the disk is ephemeral anyway).
      - key: PROMETHEUS_EXTRA_ARGS
        value: --storage.tsdb.retention.size=128MB

databases:
  # The workspace's single free Postgres belongs to production (#41).
  - name: sdip-db
    plan: free
    databaseName: sdip
    user: sdip
