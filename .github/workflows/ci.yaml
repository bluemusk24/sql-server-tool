# CI/CD (#33, #42): parallel test jobs → compose stack integration +
# e2e → build the image once and push it to GHCR → deploy that image
# to dev → validate the health endpoint.
#
# Two stages, one artifact:
#   Build   — docker/build-push-action publishes an immutable
#             YYYYMMDD-HHMMSS-shortsha tag per push to main (GHCR).
#   Deploy  — moves the :dev channel tag to the tested image, fires
#             Render's deploy hook (pulls the image), and gates on
#             /health reporting the baked commit.
#
# The original brief said "deploy to AWS using a GitHub OIDC role"; the
# owner swapped the target to Render with GHCR instead of ECR (repo is
# public → free registry, built-in GITHUB_TOKEN, no credentials needed
# to pull). Render deploys are triggered with a per-service deploy hook
# (Settings → Deploy hooks), which is a plain HTTPS POST — no cloud
# roles involved. Store the hook URL as the RENDER_DEPLOY_HOOK
# repository secret; the deploy job no-ops with a clear message while
# it is unset. Production promotion lives in promote-to-prod.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Public URL of the deployed service. Render suffixed the name at
  # creation (plain "sql-server" was taken on onrender.com).
  RENDER_APP_URL: https://sql-server-n68y.onrender.com

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
        working-directory: backend
      - name: Lint
        run: uv run ruff check .
        working-directory: backend
      - name: Unit + API tests (SQLite; env-gated live tests skip)
        run: uv run pytest
        working-directory: backend

  frontend:
    name: Frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    name: Compose stack + Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack (app waits for healthy Postgres)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Run the e2e journey against the stack
        run: |
          docker compose --profile e2e build e2e
          docker compose --profile e2e run --rm e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs > compose-logs.txt
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            compose-logs.txt
            e2e/playwright-report
          if-no-files-found: ignore

  # ── Stage 1: build the image once, publish it to GHCR (#42) ───────
  # Runs in parallel with the tests; the artifact it publishes is only
  # ever *deployed* after the full suite passes (see deploy below).
  # Tags: one immutable YYYYMMDD-HHMMSS-shortsha tag per build (UTC).
  build:
    name: Build image + push to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write # layer cache for buildx (type=gha)
    outputs:
      image: ${{ steps.meta.outputs.image }}
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute the image tag (YYYYMMDD-HHMMSS-shortsha)
        id: meta
        run: |
          # GHCR repository names must be lowercase.
          REPO="${GITHUB_REPOSITORY,,}"
          IMAGE="ghcr.io/$REPO"
          TAG="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          {
            echo "image=$IMAGE"
            echo "ref=$IMAGE:$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "building $IMAGE:$TAG"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the immutable tag
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.ref }}
          build-args: |
            SDIP_IMAGE=${{ steps.meta.outputs.ref }}
            SDIP_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Stage 2: deploy the published image to dev, then gate (#42) ────
  deploy:
    name: Deploy dev image + health gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, e2e, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Render pulls the service's default channel tag on every deploy
      # and on reschedules (#42), so :dev may only ever point at a
      # build that passed the full suite — move it here, right before
      # the hook fires. (While the blueprint still says runtime: docker,
      # Render builds from source instead; the tag move is harmless and
      # the gate below still verifies the serving commit either way.)
      - name: Point :dev at the tested image (and bootstrap :prod)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
          REF: ${{ needs.build.outputs.ref }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$IMAGE:dev" "$REF"
          echo "dev channel -> $REF"
          # One-time bootstrap (#42): the production service's default
          # tag must exist before the blueprint can pull it. Create
          # :prod only while it's missing — afterwards it moves solely
          # through the promote workflow.
          if ! docker buildx imagetools inspect "$IMAGE:prod" >/dev/null 2>&1; then
            docker buildx imagetools create -t "$IMAGE:prod" "$REF"
            echo "bootstrapped $IMAGE:prod -> $REF"
          fi
      - name: Trigger the Render deploy hook, then gate on the serving commit
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          # No hook → no deploy happened → nothing to health-gate.
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret is not set — skipping deploy."
            echo "Add it from the Render service's Settings → Deploy hooks."
            exit 0
          fi
          curl --fail-with-body --max-time 60 -X POST "$RENDER_DEPLOY_HOOK"
          # #38: HTTP 200 alone is not enough — the *previous* instance
          # answers 200 while the new deploy sits queued. Poll until
          # /health reports the commit we pushed (RENDER_GIT_COMMIT on
          # Render). Fallbacks keep non-Render environments working:
          #   - "commit" key absent  → serving a build without the field
          #   - "commit" null        → runtime doesn't export it
          expected="$GITHUB_SHA"
          echo "Polling $RENDER_APP_URL/health for commit $expected ..."
          start=$SECONDS
          attempt=0
          serving=""
          while [ $((SECONDS - start)) -lt 900 ]; do
            attempt=$((attempt + 1))
            # --max-time bounds each probe: free-tier cold wake ~50s.
            body=$(curl -fsS --max-time 90 "$RENDER_APP_URL/health" 2>/dev/null || true)
            if [ -n "$body" ]; then
              if ! printf '%s' "$body" | jq -e 'has("commit")' >/dev/null 2>&1; then
                echo "attempt $attempt: no commit field (old build) — 200-only fallback"
                echo "healthy after ~$((SECONDS - start))s ($attempt attempts)"
                exit 0
              fi
              serving=$(printf '%s' "$body" | jq -r '.commit // empty')
              if [ -z "$serving" ]; then
                echo "attempt $attempt: commit unknown (RENDER_GIT_COMMIT unset) — 200-only fallback"
                echo "healthy after ~$((SECONDS - start))s ($attempt attempts)"
                exit 0
              fi
              # Match either direction: Render may report a short hash
              # while GITHUB_SHA is the full one.
              if [ "${expected#"$serving"}" != "$expected" ] \
                 || [ "${serving#"$expected"}" != "$serving" ]; then
                echo "serving expected commit $serving — healthy after ~$((SECONDS - start))s ($attempt attempts)"
                exit 0
              fi
              echo "attempt $attempt: serving $serving — waiting for $expected"
            else
              echo "attempt $attempt: not answering — waiting"
            fi
            sleep 15
          done
          echo "deploy gate timed out after 15 minutes"
          echo "serving ${serving:-<none>}, expected $expected"
          exit 1
