# CI/CD (#33): parallel test jobs → compose stack integration + e2e →
# deploy to Render → validate the health endpoint.
#
# The original brief said "deploy to AWS using a GitHub OIDC role"; the
# owner swapped the target to Render. Render deploys are triggered with
# a per-service deploy hook (Settings → Deploy hooks), which is a plain
# HTTPS POST — no cloud roles involved. Store the hook URL as the
# RENDER_DEPLOY_HOOK repository secret; the deploy job no-ops with a
# clear message while it is unset.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Public URL of the deployed service. Render suffixed the name at
  # creation (plain "sql-server" was taken on onrender.com).
  RENDER_APP_URL: https://sql-server-n68y.onrender.com

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
        working-directory: backend
      - name: Lint
        run: uv run ruff check .
        working-directory: backend
      - name: Unit + API tests (SQLite; env-gated live tests skip)
        run: uv run pytest
        working-directory: backend

  frontend:
    name: Frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    name: Compose stack + Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack (app waits for healthy Postgres)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Run the e2e journey against the stack
        run: |
          docker compose --profile e2e build e2e
          docker compose --profile e2e run --rm e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs > compose-logs.txt
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            compose-logs.txt
            e2e/playwright-report
          if-no-files-found: ignore

  deploy:
    name: Deploy to Render + health gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Render deploy hook, then gate on the serving commit
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          # No hook → no deploy happened → nothing to health-gate.
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret is not set — skipping deploy."
            echo "Add it from the Render service's Settings → Deploy hooks."
            exit 0
          fi
          curl --fail-with-body --max-time 60 -X POST "$RENDER_DEPLOY_HOOK"
          # #38: HTTP 200 alone is not enough — the *previous* instance
          # answers 200 while the new deploy sits queued. Poll until
          # /health reports the commit we pushed (RENDER_GIT_COMMIT on
          # Render). Fallbacks keep non-Render environments working:
          #   - "commit" key absent  → serving a build without the field
          #   - "commit" null        → runtime doesn't export it
          expected="$GITHUB_SHA"
          echo "Polling $RENDER_APP_URL/health for commit $expected ..."
          start=$SECONDS
          attempt=0
          serving=""
          while [ $((SECONDS - start)) -lt 900 ]; do
            attempt=$((attempt + 1))
            # --max-time bounds each probe: free-tier cold wake ~50s.
            body=$(curl -fsS --max-time 90 "$RENDER_APP_URL/health" 2>/dev/null || true)
            if [ -n "$body" ]; then
              if ! printf '%s' "$body" | jq -e 'has("commit")' >/dev/null 2>&1; then
                echo "attempt $attempt: no commit field (old build) — 200-only fallback"
                echo "healthy after ~$((SECONDS - start))s ($attempt attempts)"
                exit 0
              fi
              serving=$(printf '%s' "$body" | jq -r '.commit // empty')
              if [ -z "$serving" ]; then
                echo "attempt $attempt: commit unknown (RENDER_GIT_COMMIT unset) — 200-only fallback"
                echo "healthy after ~$((SECONDS - start))s ($attempt attempts)"
                exit 0
              fi
              # Match either direction: Render may report a short hash
              # while GITHUB_SHA is the full one.
              if [ "${expected#"$serving"}" != "$expected" ] \
                 || [ "${serving#"$expected"}" != "$serving" ]; then
                echo "serving expected commit $serving — healthy after ~$((SECONDS - start))s ($attempt attempts)"
                exit 0
              fi
              echo "attempt $attempt: serving $serving — waiting for $expected"
            else
              echo "attempt $attempt: not answering — waiting"
            fi
            sleep 15
          done
          echo "deploy gate timed out after 15 minutes"
          echo "serving ${serving:-<none>}, expected $expected"
          exit 1
